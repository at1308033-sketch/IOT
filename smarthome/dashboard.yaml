# Sinh tự động bởi tools/build_dashboard.py — đừng sửa tay
title: Smarthome đồ án
views:
- title: Tổng quan
  path: tong-quan
  icon: mdi:floor-plan
  type: sections
  max_columns: 3
  sections:
  - column_span: 2
    cards:
    - type: heading
      heading: Mô hình nhà thông minh
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.smarthome_ket_noi
        show_state: true
        color: green
      - type: entity
        entity: switch.smarthome_che_do_tu_dong
        show_state: true
    - type: picture-elements
      image: /local/smarthome/floorplan.svg?v=decaef9c
      card_mod:
        style: '#root > .element::after { content: none; position: absolute; white-space: nowrap; pointer-events: none; z-index: 3; padding: 2px 7px; border-radius: 6px; background: rgba(40,36,33,0.92); color: #fff; font-size: 11px; font-weight: 600; line-height: 1.35; letter-spacing: 0; opacity: 0; transition: opacity 0.15s; }

          #root > .element[style*="--e-door:"]::after { content: "Cửa · chạm để mở/đóng · công tắc từ IO34 · servo IO12"; left: 50%; top: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element[style*="--e-buzzer:"]::after { content: "Còi · IO13"; left: calc(100% + 5px); top: 50%; transform: translateY(-50%); }

          #root > .element[style*="--e-pir:"]::after { content: "PIR HC-SR501 · IO35"; right: calc(100% + 5px); top: 50%; transform: translateY(-50%); }

          #root > .element[style*="--e-living:"]::after { content: "Đèn phòng khách · relay IO17"; right: calc(100% + 5px); top: 50%; transform: translateY(-50%); }

          #root > .element[style*="--e-rgb:"]::after { content: "Đèn RGB khách + ngủ · IO23/22/21 · nhấn giữ để chọn màu"; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element[style*="--e-porch:"]::after { content: "Đèn hiên · relay IO5"; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element[style*="--e-rfid:"]::after { content: "RFID RC522 · SPI 25/26/33/27"; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element[style*="--e-ldr:"]::after { content: "Quang trở · IO32"; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element[style*="--e-gas:"]::after { content: "MQ-2 · IO39"; left: calc(100% + 5px); top: 50%; transform: translateY(-50%); }

          #root > .element[style*="--e-gaslvl:"]::after { content: "Mức khí gas (AO)"; left: 50%; top: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element[style*="--e-flame:"]::after { content: "Cảm biến lửa · IO18"; left: calc(100% + 5px); top: 50%; transform: translateY(-50%); }

          #root > .element[style*="--e-fan:"]::after { content: "Quạt hút · relay IO4"; left: calc(100% + 5px); top: 50%; transform: translateY(-50%); }

          #root > .element[style*="--e-dht:"]::after { content: "DHT11 · IO19"; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element[style*="--e-bedroom:"]::after { content: "Đèn ngủ · relay IO16"; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); }

          #root > .element:hover::after { opacity: 1; }

          {% if is_state(''cover.smarthome_cua'', ''unavailable'') or state_attr(''cover.smarthome_cua'', ''friendly_name'') is none %}#root > .element[style*="--e-door:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''switch.smarthome_coi'', ''unavailable'') or state_attr(''switch.smarthome_coi'', ''friendly_name'') is none %}#root > .element[style*="--e-buzzer:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''binary_sensor.smarthome_chuyen_dong_truoc_nha'', ''unavailable'') or state_attr(''binary_sensor.smarthome_chuyen_dong_truoc_nha'', ''friendly_name'') is none %}#root > .element[style*="--e-pir:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''switch.smarthome_den_phong_khach'', ''unavailable'') or state_attr(''switch.smarthome_den_phong_khach'', ''friendly_name'') is none %}#root > .element[style*="--e-living:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''light.smarthome_den_rgb'', ''unavailable'') or state_attr(''light.smarthome_den_rgb'', ''friendly_name'') is none %}#root > .element[style*="--e-rgb:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''switch.smarthome_den_hien'', ''unavailable'') or state_attr(''switch.smarthome_den_hien'', ''friendly_name'') is none %}#root > .element[style*="--e-porch:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''sensor.smarthome_the_vua_quet'', ''unavailable'') or state_attr(''sensor.smarthome_the_vua_quet'', ''friendly_name'') is none %}#root > .element[style*="--e-rfid:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''binary_sensor.smarthome_troi_toi'', ''unavailable'') or state_attr(''binary_sensor.smarthome_troi_toi'', ''friendly_name'') is none %}#root > .element[style*="--e-ldr:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''binary_sensor.smarthome_bao_khi_gas_bep'', ''unavailable'') or state_attr(''binary_sensor.smarthome_bao_khi_gas_bep'', ''friendly_name'') is none %}#root > .element[style*="--e-gas:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''sensor.smarthome_muc_khi_gas'', ''unavailable'') or state_attr(''sensor.smarthome_muc_khi_gas'', ''friendly_name'') is none %}#root > .element[style*="--e-gaslvl:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''binary_sensor.smarthome_bao_chay_bep'', ''unavailable'') or state_attr(''binary_sensor.smarthome_bao_chay_bep'', ''friendly_name'') is none %}#root > .element[style*="--e-flame:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''switch.smarthome_quat_hut_phong_ngu'', ''unavailable'') or state_attr(''switch.smarthome_quat_hut_phong_ngu'', ''friendly_name'') is none %}#root > .element[style*="--e-fan:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''sensor.smarthome_dht11'', ''unavailable'') or state_attr(''sensor.smarthome_dht11'', ''friendly_name'') is none %}#root > .element[style*="--e-dht:"]::after { opacity: 1; }{% endif %}

          {% if is_state(''switch.smarthome_den_phong_ngu'', ''unavailable'') or state_attr(''switch.smarthome_den_phong_ngu'', ''friendly_name'') is none %}#root > .element[style*="--e-bedroom:"]::after { opacity: 1; }{% endif %}

          '
      grid_options:
        columns: full
