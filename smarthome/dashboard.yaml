- title: Mô hình 3D
  path: mo-hinh-3d
  icon: mdi:cube-outline
  type: panel
  cards:
  - type: custom:smarthome-3d-card
- title: Lịch sử truy cập
  path: truy-cap
  icon: mdi:card-account-details
  type: sections
  max_columns: 3
  sections:
  - cards:
    - type: heading
      heading: Thống kê
    - type: tile
      entity: sensor.smarthome_db_luot_truy_cap_hom_nay
      name: Lượt hôm nay
    - type: tile
      entity: sensor.smarthome_db_sai_the_hom_nay
      name: Sai thẻ hôm nay
      color: red
    - type: tile
      entity: sensor.smarthome_db_luot_truy_cap_7_ngay
      name: 7 ngày qua
    - type: tile
      entity: sensor.smarthome_the_vua_quet
      name: Thẻ vừa quẹt
    - type: heading
      heading: Sự kiện cửa & báo cháy
    - type: markdown
      content: '{% set rows = state_attr(''sensor.smarthome_db_su_kien'', ''items'') %}

        {% set rows = (rows | from_json) if rows is string else (rows or []) %}

        {% set label = {''door/open'': ''🚪 Cửa mở'', ''door/closed'': ''🚪 Cửa đóng'', ''fire/on'': ''🔥 Báo cháy'', ''fire/off'': ''✅ Hết báo cháy'', ''gas/on'': ''💨 Rò khí gas'', ''gas/off'': ''✅ Hết khí gas''} %}

        {% if rows | count == 0 %}

        _Chưa có sự kiện._

        {% else %}

        | Thời gian | Sự kiện |

        |:--|:--|

        {% for r in rows -%}

        | {{ r.t }} | {{ label.get((r.kind if r.type == ''alarm'' else r.type) ~ ''/'' ~ r.state, r.type ~ '' '' ~ r.state) }} |

        {% endfor %}

        {% endif %}'
  - column_span: 2
    cards:
    - type: heading
      heading: 20 lượt truy cập gần nhất
    - type: markdown
      content: '{% set rows = state_attr(''sensor.smarthome_db_lich_su_truy_cap'', ''items'') %}

        {% set rows = (rows | from_json) if rows is string else (rows or []) %}

        {% if rows | count == 0 %}

        _Chưa có lượt truy cập nào._

        {% else %}

        | Thời gian | Người | UID | Kết quả |

        |:--|:--|:--|:--|

        {% for r in rows -%}

        | {{ r.t }} | {{ r.who }} | `{{ r.uid if r.uid else ''—'' }}` | {{ {''granted'': ''✅'', ''denied'': ''❌'', ''lockout'': ''🚨''}[r.r] }} {{ r.rv }} |

        {% endfor %}

        {% endif %}'
- title: Quản lý
  path: quan-ly
  icon: mdi:cog
  type: sections
  max_columns: 3
  sections:
  - cards:
    - type: heading
      heading: Thêm thẻ mới
    - type: markdown
      content: '1. Quẹt thẻ mới vào đầu đọc (sẽ báo sai thẻ — bình thường).

        2. Bấm **Lấy UID thẻ vừa quẹt**, nhập tên chủ thẻ.

        3. Bấm **Thêm thẻ** — ESP32 nhận danh sách mới sau 1–2 giây.'
    - type: entities
      entities:
      - entity: sensor.smarthome_the_vua_quet
        name: Thẻ vừa quẹt
      - entity: input_text.smarthome_card_uid
        name: UID
      - entity: input_text.smarthome_card_name
        name: Tên chủ thẻ
    - type: tile
      entity: script.smarthome_doan_lay_the_vua_quet
      name: Lấy UID thẻ vừa quẹt
      icon: mdi:card-search
      tap_action:
        action: perform-action
        perform_action: script.smarthome_doan_lay_the_vua_quet
    - type: tile
      entity: script.smarthome_doan_them_the
      name: Thêm thẻ
      icon: mdi:card-plus
      color: green
      tap_action:
        action: perform-action
        perform_action: script.smarthome_doan_them_the
  - cards:
    - type: heading
      heading: Thẻ đã đăng ký
    - type: markdown
      content: '{% set cards = state_attr(''sensor.smarthome_db_danh_sach_the'', ''cards'') %}

        {% set cards = (cards | from_json) if cards is string else (cards or []) %}

        {% if cards | count == 0 %}

        _Chưa có thẻ nào. Quẹt thẻ vào đầu đọc, bấm **Lấy UID thẻ vừa quẹt**, nhập tên rồi **Thêm thẻ**._

        {% else %}

        | UID | Chủ thẻ | Trạng thái | Ngày thêm |

        |:--|:--|:--|:--|

        {% for c in cards -%}

        | `{{ c.uid }}` | {{ c.name if c.name else ''_chưa đặt tên_'' }} | {{ ''🟢 Hoạt động'' if c.active else ''⛔ Đã khóa'' }} | {{ c.created }} |

        {% endfor %}

        {% endif %}

        {% if has_value(''sensor.smarthome_so_the_hop_le'') %}Trên ESP32 hiện có **{{ states(''sensor.smarthome_so_the_hop_le'') | int }}** thẻ hợp lệ.{% else %}_ESP32 chưa kết nối — chưa đối chiếu được số thẻ._{% endif %}'
    - type: entities
      entities:
      - entity: input_select.smarthome_card_pick
        name: Chọn thẻ
    - type: tile
      entity: script.smarthome_doan_the_da_chon
      name: Khóa thẻ
      icon: mdi:card-remove
      color: orange
      tap_action:
        action: perform-action
        perform_action: script.smarthome_doan_the_da_chon
        data:
          lenh: disable
    - type: tile
      entity: script.smarthome_doan_the_da_chon
      name: Bật lại thẻ
      icon: mdi:card-account-details
      color: green
      tap_action:
        action: perform-action
        perform_action: script.smarthome_doan_the_da_chon
        data:
          lenh: enable
    - type: tile
      entity: script.smarthome_doan_the_da_chon
      name: Xóa thẻ
      icon: mdi:delete
      color: red
      tap_action:
        action: perform-action
        perform_action: script.smarthome_doan_the_da_chon
        data:
          lenh: delete
        confirmation:
          text: Xóa hẳn thẻ đang chọn? Lịch sử truy cập vẫn được giữ.
  - cards:
    - type: heading
      heading: Hệ thống
    - type: entities
      entities:
      - entity: switch.smarthome_che_do_tu_dong
      - entity: button.smarthome_dong_cua
      - entity: switch.smarthome_coi
      - type: divider
      - entity: binary_sensor.smarthome_ket_noi
      - entity: sensor.smarthome_so_the_hop_le
      - entity: sensor.smarthome_db_danh_sach_the
        name: Số thẻ trong database
      - type: divider
      - entity: button.smarthome_hieu_chuan_acs712_0_a
    - type: markdown
      content: '**Hiệu chuẩn ACS712:** tháo dây IP− khỏi rail, cắm USB cho ESP32 (adapter vẫn cắm), bấm nút hiệu chuẩn rồi nối lại dây.'
