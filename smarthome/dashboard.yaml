        columns: 12
    - type: history-graph
      title: Ánh sáng & chuyển động 24 giờ
      hours_to_show: 24
      entities:
      - sensor.smarthome_cam_bien_anh_sang
      - binary_sensor.smarthome_chuyen_dong_truoc_nha
      - binary_sensor.smarthome_troi_toi
