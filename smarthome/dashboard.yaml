  - cards:
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.smarthome_ket_noi
        state_not: 'on'
      card:
        type: markdown
        content: '**ESP32 chưa kết nối.** Thiết bị trên mặt bằng hiện tên khi board offline.'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.smarthome_bao_chay_bep
        state: 'on'
      card:
        type: markdown
        content: '## 🔥 PHÁT HIỆN LỬA Ở BẾP

          Còi và đèn RGB đang báo động.'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.smarthome_bao_khi_gas_bep
        state: 'on'
      card:
        type: markdown
        content: '## 💨 RÒ KHÍ GAS Ở BẾP

          Còi kêu, quạt hút đã bật.'
